<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<title>Live Arbitrage Scanner</title>
<style>
:root{--bg:#080b11;--panel:#111722;--panel2:#161e2b;--line:#253044;--text:#f4f7fb;--muted:#8d9aae;--green:#21d07a;--red:#ff5f6d;--yellow:#f6c84c;--blue:#5ca8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}.live{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:12px;color:var(--muted)}.pulse{width:9px;height:9px;border-radius:50%;background:var(--red)}.pulse.on{background:var(--green);box-shadow:0 0 0 5px rgba(33,208,122,.09)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}.control{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px}.control input{width:58px;background:transparent;border:0;color:var(--text);outline:0;text-align:right}.refresh{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.refresh:disabled{opacity:.5}.updated{font-size:12px;color:var(--muted);margin-left:auto}
.summary{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.value{font-size:18px;font-weight:800;margin-top:5px}.value.green{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.exchange{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.exname{font-size:15px;font-weight:800}.exsub{font-size:10px;color:var(--muted);margin-top:2px}.status{font-size:10px;font-weight:700;padding:5px 8px;border-radius:999px;background:rgba(255,95,109,.1);color:var(--red)}.status.ok{background:rgba(33,208,122,.1);color:var(--green)}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{padding:9px 8px;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:600;text-align:right;background:#0e141e;position:sticky;top:0}th:first-child,td:first-child{text-align:left;padding-left:12px}td{padding:9px 8px;border-top:1px solid rgba(37,48,68,.65);text-align:right;font-variant-numeric:tabular-nums}.coin{font-weight:800}.bid{color:var(--green)}.ask{color:#ff929b}.bestbuy{background:rgba(33,208,122,.06)}.bestsell{background:rgba(92,168,255,.06)}.tag{font-size:8px;margin-left:4px;padding:2px 4px;border-radius:4px;vertical-align:1px}.buytag{background:rgba(33,208,122,.14);color:var(--green)}.selltag{background:rgba(92,168,255,.14);color:var(--blue)}
.opps{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.opph{padding:13px 14px;border-bottom:1px solid var(--line);font-weight:800}.oppgrid{display:grid;grid-template-columns:70px 1fr 1fr 110px 110px 90px;gap:8px;padding:10px 14px;border-top:1px solid rgba(37,48,68,.65);align-items:center;font-size:12px}.oppgrid.header{border:0;background:#0e141e;color:var(--muted);font-size:10px;text-transform:uppercase}.profit{font-weight:800;color:var(--green);text-align:right}.negative{color:var(--muted)}.error{padding:12px;color:var(--red);font-size:12px;display:none}
@media(max-width:850px){.app{padding:12px}.top{align-items:center}.title{font-size:19px}.summary{grid-template-columns:1fr 1fr}.summary .stat:first-child{grid-column:1/-1}.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.exchange{min-width:88%;scroll-snap-align:start}.updated{width:100%;margin:0}.oppgrid{grid-template-columns:52px 1fr 1fr 72px}.oppgrid>:nth-child(4),.oppgrid>:nth-child(5){display:none}.oppgrid.header>:nth-child(4),.oppgrid.header>:nth-child(5){display:none}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><div class="title">Arbitrage Opportunity</div><div class="sub">Live best bid / ask · Binance · KuCoin · HTX · Top 20 coins</div></div><div class="live"><span id="pulse" class="pulse"></span><span id="liveText">Connecting</span></div></div>
 <div class="controls"><label class="control">Fee / trade <input id="fee" type="number" value="0.10" min="0" max="2" step="0.01">%</label><button id="refresh" class="refresh">Refresh now</button><div id="updated" class="updated">Waiting for live data…</div></div>
 <div class="summary"><div class="stat"><div class="label">Best opportunity</div><div id="best" class="value">Waiting…</div></div><div class="stat"><div class="label">Gross spread</div><div id="gross" class="value">—</div></div><div class="stat"><div class="label">After trading fees</div><div id="net" class="value">—</div></div></div>
 <div class="grid" id="exchangeGrid"></div>
 <div class="opps"><div class="opph">Top Arbitrage Opportunities</div><div class="oppgrid header"><div>Coin</div><div>Buy</div><div>Sell</div><div>Buy Ask</div><div>Sell Bid</div><div style="text-align:right">Net %</div></div><div id="opportunityRows"></div></div>
 <div id="error" class="error"></div>
</div>
<script>
const COINS=['BTC','ETH','BNB','XRP','SOL','TRX','DOGE','ADA','BCH','LINK','AVAX','XLM','SUI','HBAR','LTC','DOT','UNI','AAVE','NEAR','ETC'];
const EX=[['binance','BINANCE'],['kucoin','KUCOIN'],['htx','HTX']];
let latest=null,busy=false;
const $=id=>document.getElementById(id);
function fmt(v){if(!v)return '—';if(v>=10000)return '$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(v>=100)return '$'+v.toFixed(2);if(v>=1)return '$'+v.toFixed(4);return '$'+v.toFixed(v<.01?7:5)}
function statusText(s){return s==='ok'?'LIVE':'OFFLINE'}
function opportunities(data){const fee=Math.max(0,Number($('fee').value)||0)/100;return COINS.map(coin=>{const q=[];EX.forEach(([key,name])=>{const x=data.exchanges[key]?.[coin];if(x?.ask&&x?.bid)q.push({key,name,bid:x.bid,ask:x.ask})});if(q.length<2)return null;let buy=q[0],sell=q[0];q.forEach(x=>{if(x.ask<buy.ask)buy=x;if(x.bid>sell.bid)sell=x});if(buy.key===sell.key){let alt=q.filter(x=>x.key!==buy.key).sort((a,b)=>b.bid-a.bid)[0];if(alt)sell=alt}const gross=(sell.bid-buy.ask)/buy.ask*100;const net=((sell.bid*(1-fee))/(buy.ask*(1+fee))-1)*100;return{coin,buy,sell,gross,net}}).filter(Boolean).sort((a,b)=>b.net-a.net)}
function render(data){latest=data;const opps=opportunities(data);const best=opps[0];$('best').textContent=best?`${best.coin}: ${best.buy.name} → ${best.sell.name}`:'No comparable markets';$('gross').textContent=best?`${best.gross>=0?'+':''}${best.gross.toFixed(3)}%`:'—';$('net').textContent=best?`${best.net>=0?'+':''}${best.net.toFixed(3)}%`:'—';$('net').className='value'+(best&&best.net>0?' green':'');
 const grid=$('exchangeGrid');grid.innerHTML='';EX.forEach(([key,name])=>{const sec=document.createElement('section');sec.className='exchange';let rows='';COINS.forEach(coin=>{const x=data.exchanges[key]?.[coin]||{};const o=opps.find(z=>z.coin===coin);const isBuy=o?.buy.key===key,isSell=o?.sell.key===key;rows+=`<tr class="${isBuy?'bestbuy':isSell?'bestsell':''}"><td><span class="coin">${coin}</span>${isBuy?'<span class="tag buytag">BUY</span>':''}${isSell?'<span class="tag selltag">SELL</span>':''}</td><td class="bid">${fmt(x.bid)}</td><td class="ask">${fmt(x.ask)}</td></tr>`});sec.innerHTML=`<div class="head"><div><div class="exname">${name}</div><div class="exsub">USDT SPOT · REAL-TIME SNAPSHOT</div></div><span class="status ${data.status[key]==='ok'?'ok':''}">${statusText(data.status[key])}</span></div><div class="tablewrap"><table><thead><tr><th>Coin</th><th>Bid</th><th>Ask</th></tr></thead><tbody>${rows}</tbody></table></div>`;grid.appendChild(sec)});
 const or=$('opportunityRows');or.innerHTML=opps.slice(0,20).map(o=>`<div class="oppgrid"><div class="coin">${o.coin}</div><div>${o.buy.name}</div><div>${o.sell.name}</div><div>${fmt(o.buy.ask)}</div><div>${fmt(o.sell.bid)}</div><div class="profit ${o.net<=0?'negative':''}">${o.net>=0?'+':''}${o.net.toFixed(3)}%</div></div>`).join('')||'<div style="padding:14px;color:var(--muted)">Waiting for comparable prices…</div>';
 const ok=Object.values(data.status).filter(x=>x==='ok').length;$('pulse').classList.toggle('on',ok>0);$('liveText').textContent=`${ok}/3 exchanges live`;$('updated').textContent=`Updated ${new Date(data.timestamp).toLocaleTimeString()} · ${data.latencyMs} ms API fetch`;$('error').style.display='none'}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;try{const r=await fetch('/.netlify/functions/live-prices?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Live price service returned '+r.status);const d=await r.json();render(d)}catch(e){$('pulse').classList.remove('on');$('liveText').textContent='Connection error';$('error').textContent='Live data error: '+e.message;$('error').style.display='block'}finally{busy=false;$('refresh').disabled=false}}
$('refresh').addEventListener('click',load);$('fee').addEventListener('input',()=>latest&&render(latest));load();setInterval(load,3000);
</script>
</body>
</html>
