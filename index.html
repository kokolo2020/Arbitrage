<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11"><title>Live Arbitrage Scanner</title><style>
:root{--bg:#080b11;--panel:#111722;--panel2:#161e2b;--line:#253044;--text:#f4f7fb;--muted:#8d9aae;--green:#21d07a;--red:#ff5f6d;--blue:#5ca8ff;--yellow:#f6c84c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.app{max-width:1800px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}.live{height:38px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:12px;color:var(--muted)}.pulse{width:9px;height:9px;border-radius:50%;background:var(--red)}.pulse.on{background:var(--green)}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.control{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px}.control input{width:70px;background:transparent;border:0;color:var(--text);outline:0;text-align:right}.refresh{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px}.updated{font-size:12px;color:var(--muted);margin-left:auto}.summary{display:grid;grid-template-columns:1.5fr repeat(3,.8fr);gap:10px;margin-bottom:12px}.stat,.sizecard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.value{font-size:18px;font-weight:800;margin-top:5px}.green{color:var(--green)}.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.sizecard .value{font-size:15px}.sizecard small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.exchange,.opps{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.exname{font-size:14px;font-weight:800}.exsub{font-size:9px;color:var(--muted)}.status{font-size:9px;font-weight:700;padding:5px 7px;border-radius:999px;color:var(--red)}.status.ok{color:var(--green);background:rgba(33,208,122,.1)}.tablewrap{max-height:600px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px;white-space:nowrap}th{position:sticky;top:0;z-index:2;padding:7px;color:var(--muted);font-size:8px;text-transform:uppercase;text-align:right;background:#0e141e}th:first-child,td:first-child{text-align:left;padding-left:10px}td{padding:7px;border-top:1px solid rgba(37,48,68,.65);text-align:right;font-variant-numeric:tabular-nums}.coin{font-weight:800}.bid{color:var(--green)}.ask{color:#ff929b}.bestbuy{background:rgba(33,208,122,.06)}.bestsell{background:rgba(92,168,255,.06)}.tag{font-size:7px;margin-left:3px}.buytag{color:var(--green)}.selltag{color:var(--blue)}.opps{margin-top:14px}.opph{padding:13px 14px;font-weight:800}.oppgrid{display:grid;grid-template-columns:55px 1fr 1fr 75px 85px 85px 90px;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}.oppgrid.header{color:var(--muted);font-size:9px;text-transform:uppercase;background:#0e141e}.profit{text-align:right;color:var(--green);font-weight:800}.empty,.error{padding:16px;color:var(--muted);font-size:12px}.error{color:var(--red);display:none}@media(max-width:900px){.app{padding:12px}.title{font-size:19px}.summary{grid-template-columns:1fr 1fr}.summary .stat:first-child{grid-column:1/-1}.sizes{grid-template-columns:repeat(2,1fr)}.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.exchange{min-width:86%;scroll-snap-align:start}.updated{width:100%;margin:0}.oppgrid{grid-template-columns:48px 1fr 1fr 68px 78px}.oppgrid>:nth-child(4),.oppgrid>:nth-child(5){display:none}}</style></head><body><div class="app">
<div class="top"><div><div class="title">Arbitrage Opportunity</div><div class="sub">Binance · KuCoin · HTX · Bybit · Top 50 · positive net spreads only</div></div><div class="live"><span id="pulse" class="pulse"></span><span id="liveText">Connecting</span></div></div>
<div class="controls"><label class="control">Fee / trade <input id="fee" type="number" value="0.10" min="0" step="0.01">%</label><label class="control">Trade $<input id="funds" type="number" value="1250" min="1" step="50"></label><button id="refresh" class="refresh">Refresh now</button><div id="updated" class="updated">Waiting…</div></div>
<div class="summary"><div class="stat"><div class="label">Best positive opportunity</div><div id="best" class="value">Waiting…</div></div><div class="stat"><div class="label">Gross spread</div><div id="gross" class="value">—</div></div><div class="stat"><div class="label">Net after fees</div><div id="net" class="value">—</div></div><div class="stat"><div class="label">Estimated profit</div><div id="simProfit" class="value">—</div></div></div>
<div class="sizes" id="sizes"></div><div class="grid" id="exchangeGrid"></div>
<div class="opps"><div class="opph">Positive Opportunities · Ranked by Net Return</div><div class="oppgrid header"><div>Coin</div><div>Buy</div><div>Sell</div><div>Gross</div><div>Net</div><div style="text-align:right">Profit</div><div style="text-align:right">10 Trades</div></div><div id="opportunityRows"></div></div><div id="error" class="error"></div></div>
<script>
const EX=[['binance','BINANCE'],['kucoin','KUCOIN'],['htx','HTX'],['bybit','BYBIT']];let latest=null,busy=false;const $=id=>document.getElementById(id);function fmt(v){if(!v)return'—';if(v>=10000)return'$'+v.toLocaleString(undefined,{maximumFractionDigits:2});if(v>=100)return'$'+v.toFixed(2);if(v>=1)return'$'+v.toFixed(4);return'$'+v.toFixed(v<.01?7:5)}
function opportunities(data,fundsOverride){const fee=Math.max(0,Number($('fee').value)||0)/100,funds=fundsOverride||Math.max(1,Number($('funds').value)||1250);return (data.coins||[]).map(coin=>{const q=[];EX.forEach(([key,name])=>{const x=data.exchanges[key]?.[coin];if(x?.ask&&x?.bid)q.push({key,name,bid:x.bid,ask:x.ask})});let best=null;q.forEach(buy=>q.forEach(sell=>{if(buy.key===sell.key)return;const gross=(sell.bid/buy.ask-1)*100,qty=funds/buy.ask*(1-fee),final=qty*sell.bid*(1-fee),profit=final-funds,net=profit/funds*100,r={coin,buy,sell,gross,net,profit};if(!best||net>best.net)best=r}));return best}).filter(x=>x&&x.net>0).sort((a,b)=>b.net-a.net)}
function renderSizes(data){const amounts=[500,1000,1250,2500];$('sizes').innerHTML=amounts.map(a=>{const o=opportunities(data,a)[0];return`<div class="sizecard"><div class="label">$${a.toLocaleString()} trade</div><div class="value ${o?'green':''}">${o?'+$'+o.profit.toFixed(2):'$0.00'}</div><small>${o?o.coin+' · '+o.buy.name+' → '+o.sell.name+' · +'+o.net.toFixed(3)+'%':'No positive trade'}</small></div>`}).join('')}
function render(data){latest=data;renderSizes(data);const opps=opportunities(data),best=opps[0];$('best').textContent=best?`${best.coin}: ${best.buy.name} → ${best.sell.name}`:'No positive spread';$('gross').textContent=best?`+${best.gross.toFixed(3)}%`:'—';$('net').textContent=best?`+${best.net.toFixed(3)}%`:'—';$('net').className='value'+(best?' green':'');$('simProfit').textContent=best?`+$${best.profit.toFixed(2)}`:'$0.00';$('simProfit').className='value'+(best?' green':'');const grid=$('exchangeGrid');grid.innerHTML='';EX.forEach(([key,name])=>{let rows='';(data.coins||[]).forEach(coin=>{const x=data.exchanges[key]?.[coin]||{},o=opps.find(z=>z.coin===coin),ib=o?.buy.key===key,is=o?.sell.key===key;rows+=`<tr class="${ib?'bestbuy':is?'bestsell':''}"><td><span class="coin">${coin}</span>${ib?'<span class="tag buytag">BUY</span>':''}${is?'<span class="tag selltag">SELL</span>':''}</td><td class="bid">${fmt(x.bid)}</td><td class="ask">${fmt(x.ask)}</td></tr>`});const sec=document.createElement('section');sec.className='exchange';sec.innerHTML=`<div class="head"><div><div class="exname">${name}</div><div class="exsub">USDT SPOT · TOP 50</div></div><span class="status ${data.status[key]==='ok'?'ok':''}">${data.status[key]==='ok'?'LIVE':'OFFLINE'}</span></div><div class="tablewrap"><table><thead><tr><th>Coin</th><th>Bid</th><th>Ask</th></tr></thead><tbody>${rows}</tbody></table></div>`;grid.appendChild(sec)});$('opportunityRows').innerHTML=opps.map(o=>`<div class="oppgrid"><div class="coin">${o.coin}</div><div>${o.buy.name}</div><div>${o.sell.name}</div><div>+${o.gross.toFixed(3)}%</div><div class="profit">+${o.net.toFixed(3)}%</div><div class="profit">+$${o.profit.toFixed(2)}</div><div class="profit">+$${(o.profit*10).toFixed(2)}</div></div>`).join('')||'<div class="empty">No positive net arbitrage opportunity right now.</div>';const ok=Object.values(data.status).filter(x=>x==='ok').length;$('pulse').classList.toggle('on',ok>0);$('liveText').textContent=`${ok}/4 exchanges live`;$('updated').textContent=`Updated ${new Date(data.timestamp).toLocaleTimeString()} · ${data.latencyMs} ms`}
async function load(){if(busy)return;busy=true;try{const r=await fetch('/.netlify/functions/live-prices?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Price service '+r.status);render(await r.json())}catch(e){$('error').style.display='block';$('error').textContent=e.message}finally{busy=false}}$('refresh').onclick=load;$('fee').oninput=()=>latest&&render(latest);$('funds').oninput=()=>latest&&render(latest);load();setInterval(load,3000);
</script></body></html>
